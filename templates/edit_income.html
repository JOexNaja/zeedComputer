{% extends "base.html" %}
{% block content %}
<h2>แก้ไขรายรับ</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">วันที่</label>
    <input type="date" name="date" class="form-control" value="{{ income.date }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">ลูกค้า</label>
    <select name="customer_id" class="form-control">
      <option value="">-- เลือกลูกค้า --</option>
      {% for c in customers %}
        <option value="{{ c.id }}" {% if income.customer_id == c.id %}selected{% endif %}>
          {{ c.name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">แหล่งที่มา</label>
    <input type="text" name="source" class="form-control" value="{{ income.source }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">จำนวนเงิน</label>
    <input type="number" step="0.01" name="amount" class="form-control" value="{{ income.amount }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">หมายเหตุ</label>
    <input type="text" name="note" class="form-control" value="{{ income.note }}">
  </div>
  <button type="submit" class="btn btn-success">บันทึกการแก้ไข</button>
  <a href="/" class="btn btn-secondary">ยกเลิก</a>
</form>
{% endblock %}
