{% extends "base.html" %}
{% block content %}
<h2>แก้ไขรายรับ</h2>
<form method="POST">
  <div class="mb-2">
    <label>วันที่:</label>
    <input type="date" name="date" value="{{ income.date }}" class="form-control">
  </div>

  <div class="mb-2">
    <label>ลูกค้า:</label>
    <select name="customer_id" class="form-control">
      {% for c in customers %}
      <option value="{{ c.id }}" {% if c.id == income.customer_id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-2">
    <label>ประเภท (เงินสด/เงินโอน):</label>
    <input type="text" name="source" value="{{ income.source }}" class="form-control">
  </div>

  <div class="mb-2">
    <label>กิจกรรม/ทำอะไร:</label>
    <input type="text" name="activity" value="{{ income.activity }}" class="form-control">
  </div>

  <div class="mb-2">
    <label>ราคา:</label>
    <input type="number" step="0.01" name="amount" value="{{ income.amount }}" class="form-control">
  </div>

  <div class="mb-2">
    <label>หมายเหตุ:</label>
    <input type="text" name="note" value="{{ income.note }}" class="form-control">
  </div>

  <button type="submit" class="btn btn-success">บันทึกการแก้ไข</button>
  <a href="{{ url_for('index') }}" class="btn btn-secondary">ยกเลิก</a>
</form>
{% endblock %}
