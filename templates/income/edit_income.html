{% extends "base.html" %}
{% block content %}
<h2>แก้ไขชุดรายรับ คิว #{{ bill.id }}</h2>

<form method="POST">
  <label>วันที่:</label>
  <input type="date" name="date" class="form-control mb-2" value="{{ bill.date }}">

  <label>ลูกค้า:</label>
  <select name="customer_id" class="form-control mb-2">
    {% for c in customers %}
    <option value="{{ c.id }}" {% if c.id == bill.customer_id %}selected{% endif %}>{{ c.name }}</option>
    {% endfor %}
  </select>

  <div id="activity-list">
    {% for income in incomes %}
    <div class="d-flex mb-2">
      <input type="text" name="activity[]" class="form-control me-2" value="{{ income.activity }}" placeholder="กิจกรรม">
      <input type="number" step="0.01" name="amount[]" class="form-control activity-amount me-2" value="{{ income.amount }}" placeholder="ราคา">
      <input type="text" name="note[]" class="form-control me-2" value="{{ income.note }}" placeholder="หมายเหตุ">
      <!-- ✅ ปุ่มลบกิจกรรมย่อยมีเฉพาะตอนแก้ไข -->
      <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">ลบ</button>
    </div>
    {% endfor %}
  </div>

  <button type="button" id="btn-add-activity" class="btn btn-outline-secondary mb-2">+ เพิ่มกิจกรรม</button>

  <div class="mt-3">
    <label>ยอดรวม:</label>
    <input type="number" step="0.01" id="total_income" class="form-control mb-2" value="{{ bill.total_income }}" readonly>

    <label>ยอดที่ร้านได้:</label>
    <input type="number" step="0.01" name="shop_get" id="shop_get" class="form-control mb-2" value="{{ bill.shop_get }}">

    <label>ผลตอบแทนลูกค้า:</label>
    <input type="number" step="0.01" id="discount_total" class="form-control mb-2" value="{{ bill.discount }}" readonly>
  </div>

  <button type="submit" class="btn btn-success mt-2">บันทึกการแก้ไข</button>
  <a href="/report" class="btn btn-secondary mt-2">ยกเลิก</a>
</form>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // ✅ เพิ่มกิจกรรมใหม่
  document.getElementById("btn-add-activity").addEventListener("click", function() {
    let div = document.createElement("div");
    div.className = "d-flex mb-2";
    div.innerHTML = `
      <input type="text" name="activity[]" class="form-control me-2" placeholder="กิจกรรม">
      <input type="number" step="0.01" name="amount[]" class="form-control activity-amount me-2" placeholder="ราคา">
      <input type="text" name="note[]" class="form-control me-2" placeholder="หมายเหตุ">
      <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">ลบ</button>
    `;
    document.getElementById("activity-list").appendChild(div);
    bindCalculate(div.querySelectorAll("input"));
  });

  // ✅ ฟังก์ชันคำนวณยอดรวมและส่วนลด
  function calculate() {
    let total = 0;
    document.querySelectorAll(".activity-amount").forEach(input => {
      total += parseFloat(input.value) || 0;
    });
    document.getElementById("total_income").value = total.toFixed(2);

    let shopGet = parseFloat(document.getElementById("shop_get").value) || 0;
    let discount = total - shopGet;
    document.getElementById("discount_total").value = discount.toFixed(2);
  }

  // ✅ bind event ให้ input ทุกตัว
  function bindCalculate(inputs) {
    inputs.forEach(el => el.addEventListener("input", calculate));
  }

  bindCalculate(document.querySelectorAll(".activity-amount"));
  document.getElementById("shop_get").addEventListener("input", calculate);
});
</script>
{% endblock %}
