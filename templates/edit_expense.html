{% extends "base.html" %}
{% block content %}
<h2>แก้ไขรายจ่าย</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">วันที่</label>
    <input type="date" name="date" class="form-control" value="{{ expense.date }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">รายการ</label>
    <input type="text" name="item" class="form-control" value="{{ expense.item }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">จำนวนเงิน</label>
    <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">หมายเหตุ</label>
    <input type="text" name="note" class="form-control" value="{{ expense.note }}">
  </div>
  <button type="submit" class="btn btn-success">บันทึกการแก้ไข</button>
  <a href="/" class="btn btn-secondary">ยกเลิก</a>
</form>
{% endblock %}
