{% extends "base.html" %}
{% block content %}
<h2>แก้ไขบิล</h2>
<form method="POST">
  <!-- วันที่ และลูกค้า -->
  <div class="mb-3">
    <label>วันที่:</label>
    <input type="date" name="date" value="{{ bill.date }}" class="form-control">
  </div>
  <div class="mb-3">
    <label>ลูกค้า:</label>
    <select name="customer_id" class="form-control">
      {% for c in customers %}
      <option value="{{ c.id }}" {% if c.id == bill.customer_id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- ตารางกิจกรรม -->
  <h3>กิจกรรม</h3>
  <table class="table table-bordered">
    <thead>
      <tr><th>กิจกรรม</th><th>ราคา</th><th>หมายเหตุ</th></tr>
    </thead>
    <tbody>
      {% for income in incomes %}
      <tr>
        <td><input type="text" name="activity[]" value="{{ income.activity }}" class="form-control"></td>
        <td><input type="number" step="0.01" name="amount[]" value="{{ income.amount }}" class="form-control"></td>
        <td><input type="text" name="note[]" value="{{ income.note }}" class="form-control"></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <!-- สรุปรอบบิล -->
  <h3>สรุปรอบบิล</h3>
  <div class="mb-3">
    <label>รายรับรวม:</label>
    <input type="number" step="0.01" name="total_income" value="{{ bill.total_income }}" class="form-control" readonly>
  </div>
  <div class="mb-3">
    <label>ยอดที่ร้านได้:</label>
    <input type="number" step="0.01" name="shop_get" value="{{ bill.shop_get }}" class="form-control">
  </div>
  <div class="mb-3">
    <label>ส่วนลด/คืนกำไร:</label>
    <input type="number" step="0.01" name="discount" value="{{ bill.discount }}" class="form-control" readonly>
  </div>

  <!-- ปุ่ม -->
  <button type="submit" class="btn btn-success">บันทึก</button>
  <a href="/report" class="btn btn-secondary">ยกเลิก</a>
</form>

<script>
function recalcBill() {
  let total = 0;
  document.querySelectorAll('input[name="amount[]"]').forEach(el => {
    total += parseFloat(el.value) || 0;
  });
  document.querySelector('input[name="total_income"]').value = total.toFixed(2);

  let shopGet = parseFloat(document.querySelector('input[name="shop_get"]').value) || 0;
  let discount = total - shopGet;
  document.querySelector('input[name="discount"]').value = discount.toFixed(2);
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll('input[name="amount[]"], input[name="shop_get"]').forEach(el => {
    el.addEventListener("input", recalcBill);
  });
});
</script>
{% endblock %}
